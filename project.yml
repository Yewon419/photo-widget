name: PhotoWidget
options:
  bundleIdPrefix: com.windgarden
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 4VD7XCCBQN
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  PhotoWidget:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 포토위젯
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: App/PhotoWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.windgarden.photowidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.windgarden.photowidget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PhotoWidgetExtension
  PhotoWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 포토위젯
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/PhotoWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.windgarden.photowidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.windgarden.photowidget.widget
