# iOS 클라우드 빌드 + TestFlight 업로드
# 서명 = App Store Connect API 키 기반 cloud signing
# 시크릿 4종: APPSTORE_API_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_API_PRIVATE_KEY(base64 .p8), APPLE_TEAM_ID
name: ios-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Write App Store Connect API key
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APPSTORE_API_PRIVATE_KEY" | base64 --decode > ~/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8
      # 무서명 아카이브는 App Group 엔타이틀먼트가 바이너리에 안 들어간다.
      # ad-hoc(-) 서명으로 엔타이틀먼트만 박고, 배포 서명은 export의 cloud signing이 한다.
      - name: Archive (ad-hoc signed)
        run: |
          xcodebuild -project PhotoWidget.xcodeproj -scheme PhotoWidget -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/PhotoWidget.xcarchive archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
      - name: Show archived entitlements
        run: |
          APP=build/PhotoWidget.xcarchive/Products/Applications/PhotoWidget.app
          codesign -d --entitlements - "$APP"
          codesign -d --entitlements - "$APP/PlugIns/PhotoWidgetExtension.appex"
      - name: Write exportOptions.plist
        run: |
          cat > build/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF
      - name: Export & upload to TestFlight
        run: |
          xcodebuild -exportArchive -archivePath build/PhotoWidget.xcarchive \
            -exportOptionsPlist build/exportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APPSTORE_API_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPSTORE_ISSUER_ID }}
